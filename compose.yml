services:
  postgres:
    image: postgres:17
    container_name: polivra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polivra
      POSTGRES_USER: polivra
      POSTGRES_PASSWORD: polivra_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: